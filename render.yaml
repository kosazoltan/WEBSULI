services:
  - type: web
    name: websuli-api-eu
    runtime: node
    region: frankfurt
    rootDir: source
    buildCommand: npm ci --include=dev --legacy-peer-deps && npm run db:migrate && npm run build
    startCommand: node dist/index.js
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Tananyag-eredmény küldés (POST /api/material-result, 2026-09-02): Resend kulcs +
      # admin címzettek (vesszővel elválasztva). Értékük a Render dashboardon állítandó.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # AI-kulcsok (2026-09-04). `sync: false` = az ÉRTÉK a Render dashboardon él, ide
      # csak a létezésük kerül — enélkül egy blueprint-alapú újratelepítés némán
      # kulcs nélkül hagyta volna a szolgáltatást, és minden AI-funkció (okosítás,
      # HTML-javítás, fájlelemzés, Tudás-térkép) az első kattintásnál dőlt volna el.
      # Ellenőrzés: `npx tsx server/scripts/checkAIConfig.ts`, vagy admin-ként
      # GET /api/studio/ai-status.
      - key: AI_INTEGRATIONS_ANTHROPIC_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false