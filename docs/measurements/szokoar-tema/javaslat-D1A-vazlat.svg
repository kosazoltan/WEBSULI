<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 844" font-family="Nunito, sans-serif">
  <!-- Bal: MOST (élő) — Jobb: JAVASLAT D1-A. Vázlat, nem képernyőkép. -->
  <rect width="780" height="844" fill="#f1f5f9"/>
  <g>
    <text x="195" y="28" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">MOST (élő)</text>
    <rect x="10" y="40" width="370" height="790" rx="14" fill="#e0f2fe"/>
    <polygon points="195,250 120,830 270,830" fill="#c8a27a"/>
    <polygon points="195,250 60,830 330,830" fill="#c8a27a" opacity="0.55"/>
    <rect x="160" y="420" width="70" height="40" rx="6" fill="#e11d48"/>
    <rect x="175" y="330" width="40" height="22" rx="4" fill="#e11d48"/>
    <circle cx="195" cy="660" r="18" fill="#f97316"/><rect x="180" y="678" width="30" height="50" fill="#1d4ed8"/>
    <text x="195" y="790" text-anchor="middle" font-size="15" fill="#0f172a">a hullám a kamera MÖGÖTT — nem látszik</text>
    <text x="195" y="812" text-anchor="middle" font-size="15" fill="#0f172a">a kép: út + futó + piros autók</text>
    <rect x="20" y="50" width="350" height="40" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="195" y="76" text-anchor="middle" font-size="15" fill="#fff">TÁV · VÍZ 30 m · KAGYLÓ</text>
  </g>
  <g>
    <text x="585" y="28" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">JAVASLAT D1-A</text>
    <rect x="400" y="40" width="370" height="790" rx="14" fill="#e0f2fe"/>
    <!-- a hullámfal a kép tetején, a futó mögött -->
    <path d="M400,120 C460,60 520,170 585,100 C650,40 710,160 770,90 L770,330 L400,330 Z" fill="#0369a1"/>
    <path d="M400,300 C470,250 520,330 585,280 C650,240 710,320 770,270 L770,345 L400,345 Z" fill="#e0f2fe" opacity="0.9"/>
    <text x="585" y="210" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">A HULLÁM — mindig a képen,</text>
    <text x="585" y="234" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">a rés szerint nő / közeledik</text>
    <polygon points="585,330 470,830 700,830" fill="#c8a27a"/>
    <!-- futó felénk -->
    <circle cx="585" cy="470" r="20" fill="#f97316"/><rect x="568" y="490" width="34" height="56" fill="#1d4ed8"/>
    <text x="585" y="575" text-anchor="middle" font-size="14" fill="#0f172a">a futó FELÉNK menekül</text>
    <!-- törmelék a futó előtt -->
    <rect x="470" y="640" width="60" height="22" rx="10" fill="#78350f"/>
    <rect x="620" y="700" width="46" height="34" rx="4" fill="#a16207"/>
    <text x="585" y="770" text-anchor="middle" font-size="14" fill="#0f172a">sodródó törmelék (nem autó) — kerülni / átugrani</text>
    <!-- kapu-táblák alul -->
    <rect x="415" y="790" width="110" height="34" rx="8" fill="#0f172a" stroke="#facc15" stroke-width="3"/>
    <rect x="530" y="790" width="110" height="34" rx="8" fill="#0f172a" stroke="#f472b6" stroke-width="3"/>
    <rect x="645" y="790" width="110" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <text x="585" y="812" text-anchor="middle" font-size="12" fill="#fff">kapuk / válaszok</text>
  </g>
</svg>
