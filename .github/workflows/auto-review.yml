name: Auto Review

# Automatikus review-indito: minden uj / ready / frissitett PR-en egy kommenttel
# meghivja a review botokat (Sourcery AI, Codex, Vercel Agent).
#
# Mukodes:
#   - PR nyitas / draft->ready / sync / ujranyitas -> egy komment a fej SHA-jara:
#     @sourcery-ai review + @codex review + @vercel run a review
#   - SHA-nkent egyszer fut (allapotkulcs a kommentben).
#
# Ez a workflow NEM merge-el es nem javit. A merge-et az orkesztrator vegzi a
# minosegkapuk utan (docs/minosegkapuk.md, npm run gate:merge).
#
# Bot felhasznalok:
#   - sourcery-ai[bot]      - statikus analizis, stilus, bug_risk
#   - chatgpt-codex-connector[bot] - javaslatok + P1/P2 badge-ek
#   - Vercel Agent (Vercel-integracio) - review
#
# Manual trigger: @sourcery-ai review, @codex review vagy @vercel run a review
# komment egy PR-en.
#
# Or-teszt: source/tests/auto-review-workflow-guard.test.ts

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  trigger-review-bots:
    name: Trigger Sourcery + Codex review
    runs-on: ubuntu-latest
    # Draft PR-eken nem futunk - csak ready_for_review utan
    if: github.event.pull_request.draft == false
    steps:
      - name: Check if already reviewed in this push
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            // Az elso (legregebbi) 100 komment kozott keresunk mar meghivott bot-trigger-t
            // EZEN a commit-sha-n belul (hogy push utan ismet fusson). Lapozas nincs:
            // 100 komment folott az egyszeriseg nem garantalt (ismert korlat).
            const headSha = context.payload.pull_request.head.sha;
            const stateKey = `<!-- auto-review: ${headSha} -->`;
            // Atallas: a korabbi kulccsal mar megjelolt SHA-ra ne menjen masodik komment.
            const legacyKey = `<!-- bence-auto-review: ${headSha} -->`;
            const alreadyTriggered = comments.some(c => c.body?.includes(stateKey) || c.body?.includes(legacyKey));
            core.setOutput('already', alreadyTriggered ? 'true' : 'false');
            core.setOutput('state_key', stateKey);

      - name: Post review trigger comment
        if: steps.check.outputs.already == 'false'
        uses: actions/github-script@v7
        env:
          STATE_KEY: ${{ steps.check.outputs.state_key }}
        with:
          script: |
            const stateKey = process.env.STATE_KEY;
            const body = [
              stateKey,
              '## :robot: Auto review triggered',
              '',
              'Review-kerest kuldtunk az alabbi botoknak a legfrissebb commit-ra:',
              '',
              '- **@sourcery-ai** - statikus analizis, stilus, bug_risk',
              '- **@codex** - javaslatok + P1/P2 badge-ek',
              '- **Vercel Agent** - review a Vercel-integracion at',
              '',
              '**Atfogo review** (docs/specs/2026-10-18-atfogo-review.md): a teljes PR-t es a diff altal erintett programreszeket',
              'vizsgaljatok, szeletes funkcional a tervet es a mar osszevont szeleteket is, vegponttol vegpontig — lasd AGENTS.md',
              '"Review guidelines".',
              '',
              '---',
              '',
              '@sourcery-ai review',
              '',
              '@codex review',
              '',
              '@vercel run a review',
              '',
              '---',
              '',
              '_Automatikus review-indito. A merge-et az orkesztrator vegzi a minosegkapuk (docs/minosegkapuk.md) utan;',
              'a botok velemenye onmagaban nem indit merge-et._',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Trigger komment posztolva: ${stateKey}`);

      - name: Skip (already triggered for this SHA)
        if: steps.check.outputs.already == 'true'
        run: |
          echo "Bot trigger mar fut / lefutott ezen a commit-sha-n. Skip."
