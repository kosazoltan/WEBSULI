name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: TypeScript check (tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: ESLint (max 989 warnings - baseline, must not grow)
        run: npx eslint client/src server --max-warnings 989

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --import tsx --test "tests/*.test.ts"

  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: source

    # CI-JAVÍTÁS (2026-09-02): 2026-07-21 óta minden E2E-futás bukott, mert a CI-ben semmi
    # nem indított szervert (a playwright.config.ts webServer ki volt kommentezve) és nem
    # volt adatbázis. Most: Postgres-konténer + migráció + seed-tananyag, a szervert a
    # Playwright webServer indítja a buildelt dist/index.js-ből.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: websuli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/websuli
      SESSION_SECRET: test-session-secret-ci
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run DB migrations (empty Postgres → full schema)
        run: npm run db:migrate

      - name: Seed one public material for the list tests
        run: node --import tsx tests/e2e-seed.ts

      - name: Run Playwright tests (webServer starts dist/index.js)
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: source/playwright-report
          retention-days: 7

