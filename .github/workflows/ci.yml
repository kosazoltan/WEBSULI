name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # A böngészős kör szeleteinek száma (docs/specs/2026-11-18-ci-e2e-szeleteles.md). Az `e2e-parts` mátrix számozott részei
  # 1…E2E_SHARDS; az egyezést a scripts/qa/e2e-shards.test.mjs őrzi, futás közben a záró „Playwright E2E” job számláló-ellenőre.
  E2E_SHARDS: 6

jobs:
  # Tulajdonosi döntés 2026-10-15 (docs/specs/2026-10-15-haromfazis-ci-ellenorzes.md): terv → végrehajtási utasítás → kód, kikényszerítve.
  three-phase:
    name: Háromfázisú rend
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit test (az ellenőrző saját tesztje)
        run: node --test scripts/qa/three-phase-check.test.mjs scripts/qa/repo-rules.test.mjs scripts/qa/verify-render-revision.test.mjs scripts/qa/verify-render-settings.test.mjs scripts/qa/set-proxy-secret.test.mjs scripts/qa/e2e-shards.test.mjs
      # Minőségkapuk (docs/minosegkapuk.md, tulajdonosi utasítás 2026-11-17): a kapuk és a kapu-bizonyíték hook saját tesztjei,
      # valamint a .agents ↔ .claude skill-tükör ellenőrzése (a tartalom nem csúszhat szét).
      - name: Minőségkapuk saját tesztjei
        run: node --test scripts/qa/gates/*.test.mjs scripts/qa/hooks/*.test.mjs
      - name: Skill-tükör (.agents/skills ↔ .claude/skills)
        run: node scripts/qa/gates/skills-sync-check.mjs
      - name: Háromfázisú rend ellenőrzése
        run: node scripts/qa/three-phase-check.mjs --base origin/${{ github.base_ref }}

  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: TypeScript check (tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: ESLint (0 warnings - warnings are fixed, not tolerated)
        run: npx eslint client/src server --max-warnings 0

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --import tsx --test "tests/*.test.ts"

  # docs/specs/2026-11-05-ci-learning-db.md: az adatbázisos integrációs tesztek (npm run test:learning-db) eddig csak helyben
  # futottak, ezért egy bukó teszt észrevétlen maradt (#397). A harness saját, eldobható postgres:17 konténert indít
  # (loopback, projekt-ENV nélkül), a runner Dockerét használja.
  learning-db:
    name: DB integrációs tesztek
    runs-on: ubuntu-latest
    needs: lint-typecheck
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database integration tests
        run: npm run test:learning-db

  # docs/specs/2026-11-03-befejezes-onfejlesztes-dual-arch.md: a program és a fejlesztés ARM64-en és x64-en is fusson.
  native-arch:
    name: Natív futás (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint-typecheck
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Platform
        run: node -p "process.platform + '-' + process.arch"

      - name: Native dependencies load on this CPU
        run: npm run doctor:arch

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # docs/specs/2026-11-18-ci-e2e-szeleteles.md: a böngészős kör egy szálon 78–92 percig futott. Most hat súlyozott szeletben fut
  # (mindegyik saját Postgres-konténerrel, migrációval, seeddel és szerverrel; a szeleten belül marad az egy worker és a két
  # újrapróba), a hetedik rész az öt kiegészítő konfig. A kötelező ellenőrzés nevét („Playwright E2E”) a záró `e2e-tests` job viseli.
  e2e-parts:
    name: E2E rész (${{ matrix.part }})
    # Rögzített futtatókép: az ubuntu-latest már Ubuntu 26.04, amit a Playwright 1.57 nem támogat
    # (`playwright install --with-deps` elbukik). A rögzítés a Playwright frissítéséig marad.
    runs-on: ubuntu-24.04
    needs: lint-typecheck
    timeout-minutes: 60
    strategy:
      # Egy rész bukása nem állítja le a többit: egy körben minden bukás látszik.
      fail-fast: false
      matrix:
        part: ['1', '2', '3', '4', '5', '6', 'kiegeszito']
    defaults:
      run:
        working-directory: source

    # CI-JAVÍTÁS (2026-09-02): 2026-07-21 óta minden E2E-futás bukott, mert a CI-ben semmi
    # nem indított szervert (a playwright.config.ts webServer ki volt kommentezve) és nem
    # volt adatbázis. Most: Postgres-konténer + migráció + seed-tananyag, a szervert a
    # Playwright webServer indítja a buildelt dist/index.js-ből.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: websuli
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # WEBSULI_E2E=1 (playwright.config.ts): a szerver csak literális loopback IP-t fogad el, localhost-ot nem.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/websuli
      SESSION_SECRET: test-session-secret-ci
      CI: "true"
      E2E_PART: ${{ matrix.part }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run DB migrations (empty Postgres → full schema)
        run: npm run db:migrate

      - name: Seed one public material for the list tests
        run: node --import tsx tests/e2e-seed.ts

      # A teljes listából minden rész ugyanazt a felosztást számolja ki (tiszta függvény), és a sajátját futtatja.
      # A --list módban a JSON a szabványos kimenetre megy (a PLAYWRIGHT_JSON_OUTPUT_NAME ott nem ír fájlt).
      - name: Szelet kijelölése (súlyozott felosztás a teljes tesztlistából)
        if: matrix.part != 'kiegeszito'
        run: |
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/e2e-list.json"
          node ../scripts/qa/e2e-shards.mjs plan --list "$RUNNER_TEMP/e2e-list.json" --weights ../scripts/qa/e2e-shard-weights.json --total "$E2E_SHARDS" --part "$E2E_PART" --out "$RUNNER_TEMP/e2e-shard.txt"

      - name: Run Playwright tests (a szelet tesztjei; webServer starts dist/index.js)
        if: matrix.part != 'kiegeszito'
        run: npx playwright test --test-list "$RUNNER_TEMP/e2e-shard.txt" --reporter=dot,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-report-${{ matrix.part }}.json

      - name: Verify scored HTML banks and reload persistence
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.html-persistence.config.ts

      - name: Verify the open-answer arbiter in both lesson players (T7.2)
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.lesson-arbiter.config.ts

      - name: Verify service worker install keeps the previous offline cache (#207)
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.service-worker.config.ts

      # docs/specs/2026-11-02-maradek-kockazatok.md: ez a két böngészős konfig nem futott a CI-ben, ezért észrevétlenül
      # elavult (borító-spec 2026-10-17, válaszkeverés 2026-11-02). Most minden PR-on futnak.
      - name: Verify lesson cover, continuous exercise lists and the fusion lesson (learning flow)
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.learning-flow.config.ts

      - name: Verify saved practice rounds (first answer, retry, reload, reward)
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.lesson-practice.config.ts

      # docs/specs/2026-11-20-tgm-valtozatossag-abrak.md (S5a, V7): kódszótári visszajelzés-nyitás a jelölt leckén, három nézetben.
      - name: Verify varied feedback openers on a variety-marked lesson
        if: matrix.part == 'kiegeszito'
        run: npx playwright test --config playwright.lesson-variety.config.ts

      # A számláló-ellenőr bemenete: a rész JSON-jelentése (bukott tesztek mellett is; megszakított futásnál nem).
      - name: Upload the part's JSON report (számláló-ellenőr)
        if: ${{ !cancelled() && matrix.part != 'kiegeszito' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-json-${{ matrix.part }}
          path: source/e2e-report-${{ matrix.part }}.json
          # Hiányzó jelentés → a rész bukik: újrafuttatásnál egy korábbi kísérlet elavult jelentése nem kerülhet az ellenőrbe.
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.part }}
          path: |
            source/playwright-report
            source/test-results
          overwrite: true
          retention-days: 7

  # A főág védelmében és a pre-merge-gate listájában szereplő kötelező ellenőrzés: EGY, változatlan nevű job. Csak akkor zöld,
  # ha minden rész zöld (a kihagyott / megszakított rész is bukás — ezért always()), és a számláló-ellenőr szerint a részekben
  # lefutott és átment tesztek (+ a listában is deklarált kihagyások) összege = a teljes tesztlista.
  e2e-tests:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, e2e-parts]
    if: ${{ always() }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - name: Minden rész zöld?
        run: |
          echo "e2e-parts: $PARTS_RESULT"
          test "$PARTS_RESULT" = "success"
        env:
          PARTS_RESULT: ${{ needs.e2e-parts.result }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download the parts' JSON reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-json-*
          path: ${{ runner.temp }}/e2e-reports
          merge-multiple: true

      - name: Számláló-ellenőr (a részekben lefutott tesztek összege = a teljes lista)
        run: |
          npx playwright test --list --reporter=json > "$RUNNER_TEMP/e2e-list.json"
          node ../scripts/qa/e2e-shards.mjs check --list "$RUNNER_TEMP/e2e-list.json" --reports "$RUNNER_TEMP/e2e-reports" --total "$E2E_SHARDS" --weights ../scripts/qa/e2e-shard-weights.json --weights-out "$RUNNER_TEMP/e2e-shard-weights.measured.json"
        env:
          CI: "true"

      - name: Upload the measured shard weights
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-weights-measured
          path: ${{ runner.temp }}/e2e-shard-weights.measured.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
