# Cogni modulindex — modul → követett könyvtár, fő fájlok, ellenőrző parancs (csak létező út / npm-parancs).
# Őr: source/tests/memory-layer-refs-guard.test.ts

cogni:
  kind: module_index
  name: websuli-modules
  modules:
    - id: client
      path: source/client/src/
      files:
        - source/client/src/main.tsx
        - source/client/src/App.tsx
      verify: "npm run gate:stage"
    - id: server
      path: source/server/
      files:
        - source/server/index.ts
        - source/server/routes.ts
        - source/server/db.ts
      verify: "npm run gate:stage"
    - id: shared
      path: source/shared/
      files:
        - source/shared/schema.ts
      verify: "npm run check"
    - id: migrations
      path: source/migrations/
    - id: tests
      path: source/tests/
      verify: "npm run test"
    - id: qa
      path: scripts/qa/
      files:
        - scripts/qa/three-phase-check.mjs
        - scripts/qa/gates/record-review.mjs
        - scripts/qa/zaro-hurok.mjs
      verify: "node --test scripts/qa/gates/*.test.mjs scripts/qa/hooks/*.test.mjs"
    - id: close_loop
      path: scripts/qa/zaro-hurok.mjs
      verify: "node --test scripts/qa/zaro-hurok.test.mjs"
    - id: specs
      path: docs/specs/
      verify: "node scripts/qa/three-phase-check.mjs"
    - id: skills
      path: .agents/skills/
      mirror: .claude/skills/
      verify: "node scripts/qa/gates/skills-sync-check.mjs"
