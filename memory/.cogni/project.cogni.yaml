# Cogni-format projekt-snapshot (a 0645f48f váz WEBSULI-kitöltése)
# format-version: 1
# scope: WEBSULI-only
# Frissítés: minden lezárt feladat után (a gépi „nincs új” jelölő tervezett, a feat/zaro-hurok-1 PR-ral érkezik).

cogni:
  kind: project_snapshot
  name: websuli
  generated: 2026-11-22
  source: "AGENTS.md, package.json, source/package.json, memory/projects/websuli/project-overview.md"

  identity:
    purpose: "Oktatási platform 6–18 éves diákoknak: HTML-tananyagok kezelése, megtekintése és AI-val való fejlesztése, leckék és játékok"
    language: "magyar felület és dokumentáció, angol kód-azonosítók"
  stack:
    runtime: "Node.js 24.x"
    frontend: "React 18, Vite 5, Tailwind CSS 3"
    backend: "Express 4, TypeScript"
    database: "PostgreSQL (Neon), Drizzle ORM"
    e2e: "Playwright"
    hosting: "Vercel (SPA) + Render (API)"
  entrypoints:
    - path: source/client/src/main.tsx
      role: "a kliens (SPA) belépője"
    - path: source/server/index.ts
      role: "az API-szerver belépője"
    - path: source/shared/schema.ts
      role: "a Drizzle adatséma"
    - path: package.json
      role: "gyökér-manifest: a minőségkapuk (gate:*) parancsai"
  rules:
    - AGENTS.md
    - docs/agent-haromfazisu-munka.md
    - docs/minosegkapuk.md
    - docs/kanban.md
    - docs/agent-csapdak.md
