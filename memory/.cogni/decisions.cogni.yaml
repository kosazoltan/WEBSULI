      title: "Gépköltöztetés utáni sorrend és keret"
      decision: |
        „sorrend H0 futtató → H1 advent → H2 kész PR-ok → H3 TGM → H4–H6; a vak ellenőr köreire ebben a futásban legfeljebb
        30 USD OpenRouter-keret, elfogyáskor megállás és kérdés; az F1/F2 fájlok nem kerülnek a repóba (munkafa + Drive-mentés),
        csak személytelen kivonat; az adventi képek fizetős próbaköre a PR-C után, újabb kérdéssel.”
      source: "docs/specs/2026-11-21-gepkoltoztetes-folytatas.md 4. fejezet (űrlap)"
