      title: "Advent-ismétlés, vak futtató eredet-igazolás, #510, #418"
      decision: |
        „advent — ha átvétel után ismétlés nélkül nincs teljes 2. kör, »Ismétlés a legrégebbiekből«; vak futtató — aláírt
        eredet-igazolás nem kell (»Nem, ismert korlát«); #510 szűrő-elutasítás — »Újra, átfogalmazott célfájllal« (sikerült);
        #418 — futás közbeni memóriafigyelés helyett »Mérés az első éles körben« (450 MB fölötti csúcsnál külön PR).”
      source: "docs/specs/2026-11-21-gepkoltoztetes-folytatas.md 10. fejezet (Állapotnapló, űrlap)"
      files:
        - docs/specs/2026-11-21-gepkoltoztetes-folytatas.md
