# WEBSULI — gépi olvasható projekt-manifest (YAML réteg)
# Forma: a másik gépről érkezett váz (0645f48f) WEBSULI-változata.
# Szabály: minden aktív hivatkozás ezen a fejen létező fájlra / parancsra mutat (őr: source/tests/memory-layer-refs-guard.test.ts);
# ami még nincs a repóban, az CSAK a `planned` szakaszban áll, „tervezett” jelöléssel.
# Titkot (.env-érték, token, jelszó), e-mail-címet, személyes adatot ide írni TILOS.
# Minden érték forrása a mellette álló megjegyzésben.

project:
  name: WEBSULI
  domain: "Oktatási platform 6–18 éves diákoknak: HTML-tananyagok kezelése, megtekintése és AI-val való fejlesztése, leckék és játékok"   # memory/projects/websuli/project-overview.md:14
  language: "magyar (felhasználói felület és dokumentáció); a kód-azonosítók angolok"   # AGENTS.md:3-4
  runtime: "Node.js 24.x"           # source/package.json:6-7 (engines.node)
  stack:
    frontend: "React 18, Vite 5, Tailwind CSS 3, wouter, TanStack Query"   # source/package.json dependencies / devDependencies
    backend: "Express 4 (TypeScript, tsx)"                                 # source/package.json dependencies
    database: "PostgreSQL (Neon), Drizzle ORM"                              # séma: source/shared/schema.ts, migrációk: source/migrations/
    e2e: "Playwright"                                                       # source/package.json devDependencies
    hosting: "Vercel (SPA) + Render (API) + Neon Postgres"                  # memory/indexes/index.yml:14 (procedural_deploy)
  app_root: source/                 # package.json:4 (gyökér description)

repository:
  default_branch: main              # git: refs/remotes/origin/HEAD → origin/main; AGENTS.md „Git”: feature branch → PR → zöld CI → merge
  workflow: "háromfázisú: terv (docs/specs/) → végrehajtási utasítás (*-vegrehajtas.md) → kód"   # AGENTS.md „Háromfázisú munka”
  kanban:
    environment: claude-code        # a Claude Code saját környezete, NEM a Hermes (globális felhasználói szabály)
    experience_board: "~/.claude/projects/<proj>/kanban/tapasztalat-kanban.md"
    # <proj> = a fő munkakönyvtár abszolút útvonala, minden nem betű/számjegy karakter „-”-re cserélve
    # (példa: D:\repo\WEBSULI → D--repo-WEBSULI); a ~/.claude helyét a CLAUDE_CONFIG_DIR felülírhatja.

memory:                # a memória-rétegek térképe (csak ezen a fejen létező utak)
  yaml_manifest: memory/manifest.yaml
  qmd_index: memory/index.qmd
  cogni: memory/.cogni/
  notes: memory/notes/              # új jegyzet csak a memory/indexes/index.yml notes gyűjteményével (source/tests/memory-index-guard.test.ts)
  memory_index: memory/indexes/index.yml
  trap_table: docs/agent-csapdak.md # az egyetlen WEBSULI-csapdakatalógus
  skills: .agents/skills/           # forrás
  skills_mirror: .claude/skills/    # tükör — CSAK a scripts/qa/gates/gates.config.json mirroredSkills listájának skilljei (scripts/qa/gates/skills-sync-check.mjs)
  retro: docs/handoffs/             # *-retro.md
  knowledge: .hermes/projekt/TUDAS.md
  vector_index: "nem elérhető — a WEBSULI-környezetben nincs vektoros memória"

quality_gates:         # gyökér package.json:5-18; sorrend: AGENTS.md:157-164 („Minőségkapuk” 1–4. pont)
  - lint: "npm run gate:lint"                                  # minden kibocsátás előtt (AGENTS.md:157)
  - stage: "npm run gate:stage"                                # minden fejlesztési szakasz után (AGENTS.md:158-159)
  - push: "npm run gate:push"                                  # AGENTS.md:162
  - independent_review: "független ellenőr, ítélet rögzítése: node scripts/qa/gates/record-review.mjs"   # AGENTS.md:160-162 (a push-kapu után, a PR-kapu előtt)
  - pr: "npm run gate:pr -- --body-file <leírás.md>"           # AGENTS.md:163; a PR-kapu a fejre szóló ítéletet ellenőrzi
  - ci: "push + PR → zöld CI"                                  # AGENTS.md:163
  - merge: "npm run gate:merge -- <PR>"                        # közvetlenül a merge előtt (AGENTS.md:163)

close_loop:            # a záró hurok gépi kapuja (docs/specs/2026-11-22-zaro-hurok-websuli.md D1–D14) — nem része a gate:* láncnak
  check: "npm run zaro:check -- --since <ISO>"                # exit 0 = zöld, 1 = piros, 2 = hibás hívás
  no_new: "node scripts/qa/zaro-hurok.mjs nincs-uj --kind <trap,yaml,qmd,cogni,kanban>"
  hygiene: "node scripts/qa/zaro-hurok.mjs hygiene"           # csak riport; --apply csak a beolvasztott ágat / lezárt munkafát
  blind_convergence: "node scripts/qa/zaro-hurok.mjs konvergencia"   # új vak kör előtt; exit 1 = tilos új kör
  skill: .agents/skills/websuli-zaro-hurok/SKILL.md          # a hét lépés; AGENTS.md „Záró hurok (kötelező)” szakasza
