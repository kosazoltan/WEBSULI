quality_gates: []      # TODO: pl. - test: "npm test"

# 2026-11-23 — kód-review: felhős vak kör kivezetve
code_review:
  local_reviewer: scripts/qa/gates/local-review.mjs   # helyi Ollama (Ornith-1.5-9B Q8_0), ANGOL prompt
  evidence: "<git-common-dir>/websuli-qa-evidence/review-<fej>.json"
  cloud_second_opinion: "csak kockázatos fájlnál (migráció/auth/fizetés/e-mail/CI), egyszer / PR, nem kapu"
  decision_doc: docs/specs/2026-11-23-vak-kor-kivezetes.md
  mem0_backend: "Docker pgvector hermes-mem0-pg (127.0.0.1:55432) — 2026-11-23"
  closing_push: "node D:/repo/Hermes-agent/scripts/zaro-hurok.mjs push --repo D:/repo/WEBSULI (frissíti a vector-indexet)"
  task_register: "SQL feladat.tasks (Docker hermes-mem0-pg) — node D:/repo/Hermes-agent/scripts/feladat.mjs list --repo D:/repo/WEBSULI; a főterv 2026-11-23 tételei betöltve"
  local_review_limits: "num_predict 1500, 3 újrapróba, csonka JSON kimentése (2026-11-23, PR-C élő fetch failed)"
  gate_merge_env: "a Hermes .env DATABASE_URL-je eltávolítva (2026-11-23) — régi folyamatokban env -u DATABASE_URL"
  e2e_gate_timeout: "WEBSULI_E2E_TIMEOUT_MIN; pre-pr-gate 150/160 perc (PR #542)"
  local_review_determinism: "seed 42 + repeat_penalty 1.15; értelmezhetetlen darab felezve (2026-11-23)"
  inventory: "teljes hiányleltár: docs/specs/2026-11-23-teljes-hianyleltar.md (ág docs/hianyleltar-2026-11-23), SQL-be töltve [P-0NN]/[BL]/[H-]/[KB] előtaggal"
  open_prs_2026_11_23: "#541 (vak kör kivezetés), #544 (advent PR-C), #545 (hiányleltár docs); merged: #542, #543"
