#   # zaro-hurok: <ISO-időpont> nincs-uj
# Titkot (.env-érték, token, jelszó) ide írni TILOS.

project:
  name: WEBSULI
  domain: ""          # TODO: egy mondat a repó céljáról
  language: ""        # TODO
  runtime: ""         # TODO

repository:
  default_branch: ""  # TODO (main/master/dev)
  kanban_board: websuli

memory:                # a memória-rétegek térképe
  yaml_manifest: memory/manifest.yaml
  machine_facts: .agent/memory/yaml/index.yaml
  qmd_index: memory/index.qmd
  cogni: memory/.cogni/
  notes: memory/notes/
  trap_table: .hermes/projekt/TRAP.md
  skills: .hermes/skills/
  vector_index: .hermes/projekt/vector/   # gitignore-olt, helyi mxbai-embed-large (Ollama)
