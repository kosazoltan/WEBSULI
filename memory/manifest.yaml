# WEBSULI — gépi olvasható projekt-manifest (YAML réteg)
# Forma: Bookkeeper memory/manifest.yaml mintája (agentic-qa-kit zaro-hurok v1).
# Frissítés: a záró hurokban, minden lezárt feladat után. Ha nincs új tény, a fájl VÉGÉRE:
#   # zaro-hurok: <ISO-időpont> nincs-uj
# Titkot (.env-érték, token, jelszó) ide írni TILOS.

project:
  name: WEBSULI
  domain: ""          # TODO: egy mondat a repó céljáról
  language: ""        # TODO
  runtime: ""         # TODO

repository:
  default_branch: ""  # TODO (main/master/dev)
  kanban_board: websuli

memory:                # a memória-rétegek térképe
  yaml_manifest: memory/manifest.yaml
  machine_facts: .agent/memory/yaml/index.yaml
  qmd_index: memory/index.qmd
  cogni: memory/.cogni/
  notes: memory/notes/
  trap_table: .hermes/projekt/TRAP.md
  skills: .hermes/skills/
  vector_index: .hermes/projekt/vector/   # gitignore-olt, helyi mxbai-embed-large (Ollama)
  knowledge: .hermes/projekt/TUDAS.md

quality_gates: []      # TODO: pl. - test: "npm test"

# 2026-11-23 — kód-review: felhős vak kör kivezetve
code_review:
  local_reviewer: scripts/qa/gates/local-review.mjs   # helyi Ollama (Ornith-1.5-9B Q8_0), ANGOL prompt
  evidence: "<git-common-dir>/websuli-qa-evidence/review-<fej>.json"
  cloud_second_opinion: "csak kockázatos fájlnál (migráció/auth/fizetés/e-mail/CI), egyszer / PR, nem kapu"
  decision_doc: docs/specs/2026-11-23-vak-kor-kivezetes.md
