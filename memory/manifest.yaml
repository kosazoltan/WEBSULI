# WEBSULI — gépi olvasható projekt-manifest (YAML réteg)
# Szabály: csak gépileg igazolt tény áll itt — követett fájl / könyvtár útja, létező npm-parancs, vagy szó szerinti idézet (quote)
# a forrás fájl:sorával (source). Értelmezés, ígéret és gépállapot nem kerül ide (őr: source/tests/memory-layer-refs-guard.test.ts).
# Titkot, e-mail-címet, személyes adatot ide írni TILOS.

project:
  name: WEBSULI
  domain:
    quote: "Oktatási platform 6-18 éves diákok számára. HTML tananyagok kezelése, megtekintése, AI-val való fejlesztése."
    source: "memory/projects/websuli/project-overview.md:14"
  language:
    quote: "Magyarul dolgozunk; a kód-azonosítók angolok."
    source: "AGENTS.md:4"
  runtime:
    quote: "node: 24.x"
    source: "source/package.json:7"
  app_root: source/
  dependencies:
    - quote: "react: ^18.3.1"
      source: "source/package.json:125"
    - quote: "vite: ^5.4.20"
      source: "source/package.json:176"
    - quote: "express: ^4.21.2"
      source: "source/package.json:102"
    - quote: "drizzle-orm: ^0.45.2"
      source: "source/package.json:98"
    - quote: "@neondatabase/serverless: ^0.10.4"
      source: "source/package.json:42"
    - quote: "@playwright/test: ^1.57.0"
      source: "source/package.json:147"
  hosting:
    quote: "Élő deploy-eljárások (Vercel SPA + Render API + Neon Postgres)"
    source: "memory/indexes/index.yml:14"

repository:
  default_branch:
    quote: "base: origin/main"
    source: "scripts/qa/gates/gates.config.json:3"
  workflow:
    quote: "először terv (docs/specs/), utána mesterséges intelligencia számára olvasható végrehajtási utasítás (*-vegrehajtas.md)"
    source: "AGENTS.md:12"
  experience_kanban: "~/.claude/projects/<proj>/kanban/tapasztalat-kanban.md"   # a tulajdonos által megadott út; ezen a fejen nem ellenőrzött

memory:
  yaml_manifest: memory/manifest.yaml
  qmd_index: memory/index.qmd
  cogni: memory/.cogni/
  notes: memory/notes/
  memory_index: memory/indexes/index.yml
  trap_table: docs/agent-csapdak.md
  skills: .agents/skills/
  skills_mirror:
    path: .claude/skills/
    scope_config: scripts/qa/gates/gates.config.json
    quote: "names: loadConfig().mirroredSkills"
    source: "scripts/qa/gates/skills-sync-check.mjs:40"
  retro: docs/handoffs/
  knowledge: .hermes/projekt/TUDAS.md

quality_gates:
  - step: lint
    quote: "npm run gate:lint"
    source: "AGENTS.md:157"
  - step: stage
    quote: "npm run gate:stage"
    source: "AGENTS.md:158"
  - step: order
    quote: "gate:stage (szakaszonként) → gate:push → független ellenőr + record-review → gate:pr -- --body-file <leírás.md> → push + PR → zöld CI → közvetlenül a merge előtt gate:merge -- <PR>"
    source: "AGENTS.md:162-163"
  - step: record_review
    quote: "node scripts/qa/gates/record-review.mjs --head <hash> --verdict IGEN|IGEN, FELTÉTELLEL|NEM --report <jelentés.md>"
    source: "scripts/qa/gates/record-review.mjs:5"
